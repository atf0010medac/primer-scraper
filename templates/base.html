<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Oposiciones BOE{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
</head>
<body class="d-flex flex-column min-vh-100">

    <!-- 🔹 Barra de navegación -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary px-4">
        <a class="navbar-brand fw-bold" href="/">Oposiciones BOE</a>
        <div class="ms-auto d-flex align-items-center">
            {% if session.get('user_id') %}
                <span class="text-white me-3">Hola, {{ session.get('username') }}</span>
                <a href="{{ url_for('logout') }}" class="btn btn-outline-light btn-sm">Cerrar sesión</a>
            {% else %}
                <a href="{{ url_for('login') }}" class="btn btn-outline-light btn-sm me-2">Iniciar sesión</a>
                <a href="{{ url_for('register') }}" class="btn btn-light btn-sm">Registrarse</a>
            {% endif %}
        </div>
    </nav>

    <!-- 🔹 Contenido principal -->
    <main class="flex-grow-1 py-4">
        {% block content %}{% endblock %}
    </main>

    <!-- 🔹 Footer común -->
    <footer class="bg-primary text-white text-center py-3 mt-auto">
        <p class="mb-0">© 2025 Oposiciones BOE — Desarrollado por <strong>Alex y equipo</strong></p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
